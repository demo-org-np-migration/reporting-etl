name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/demo-org-np-migration/reporting-etl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest

  update-gitops-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: demo-org-np-migration/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump staging image tag
        run: |
          yq -i '.image.tag = "${{ needs.build-and-push.outputs.tag }}"' \
            gitops/apps/reporting-etl/values-staging.yaml

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "reporting-etl-bot"
          git config user.email "reporting-etl-bot@cauri.io"
          git add apps/reporting-etl/values-staging.yaml
          git commit -m "reporting-etl: bump staging image to ${{ needs.build-and-push.outputs.tag }}"
          git push

  update-gitops-prod:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: demo-org-np-migration/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump prod image tag
        run: |
          yq -i '.image.tag = "${{ needs.build-and-push.outputs.tag }}"' \
            gitops/apps/reporting-etl/values-prod.yaml

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "reporting-etl-bot"
          git config user.email "reporting-etl-bot@cauri.io"
          git add apps/reporting-etl/values-prod.yaml
          git commit -m "reporting-etl: bump prod image to ${{ needs.build-and-push.outputs.tag }}"
          git push
