[project]
name = "reporting-etl"
version = "0.1.0"
description = "Consumidor de payments.completed que carga el warehouse (fact_payments, daily_volume)."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5,<3",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.20,<1",
    "pydantic-settings>=2.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
